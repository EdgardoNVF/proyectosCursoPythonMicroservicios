apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana

spec:

  replicas: 1

  selector:

    matchLabels:
      app: grafana

  template:

    metadata:

      labels:
        app: grafana

    spec:

      containers:

        - name: grafana

          image: grafana/grafana:13.2.2

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          resources:

            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---

apiVersion: v1
kind: Service

metadata:
  name: grafana

spec:

  selector:
    app: grafana

  ports:

    - name: http
      port: 3000
      targetPort: 3000

  type: ClusterIP
