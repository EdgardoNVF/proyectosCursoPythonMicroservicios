apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus

spec:

  replicas: 1

  selector:

    matchLabels:
      app: prometheus

  template:

    metadata:

      labels:
        app: prometheus

    spec:

      containers:

        - name: prometheus

          image: prom/prometheus:v3.13.3

          imagePullPolicy: IfNotPresent

          args:

            - "--config.file=/etc/prometheus/prometheus.yml"

          ports:

            - name: http
              containerPort: 9090

          resources:

            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:

            - name: config

              mountPath: /etc/prometheus/prometheus.yml

              subPath: prometheus.yml

              readOnly: true


      volumes:

        - name: config

          configMap:

            name: prometheus-config

---

apiVersion: v1
kind: Service

metadata:
  name: prometheus

spec:

  selector:
    app: prometheus

  ports:

    - name: http
      port: 9090
      targetPort: 9090

  type: ClusterIP
