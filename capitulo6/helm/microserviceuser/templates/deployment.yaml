apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "microserviceuser.fullname" . }}

  labels:
    app.kubernetes.io/name: {{ include "microserviceuser.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:

  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microserviceuser.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:

    metadata:
      labels:
        app.kubernetes.io/name: {{ include "microserviceuser.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:

      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}

      {{- if .Values.persistence.enabled }}

      initContainers:

        - name: volume-permissions

          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} {{ .Values.persistence.mountPath }}
              chmod -R 775 {{ .Values.persistence.mountPath }}

          securityContext:
            runAsUser: 0

          volumeMounts:

            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

      {{- end }}

      containers:

        - name: microserviceuser

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}

          ports:

            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
{{ toYaml .Values.resources | indent 12 }}

          {{- if .Values.persistence.enabled }}

          volumeMounts:

            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

          {{- end }}

      {{- if .Values.persistence.enabled }}

      volumes:

        - name: data

          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}

      {{- end }}