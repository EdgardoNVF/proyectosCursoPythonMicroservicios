apiVersion: apps/v1
kind: Deployment

metadata:
  name: apisix

spec:

  replicas: 1

  selector:

    matchLabels:
      app: apisix

  template:

    metadata:

      labels:
        app: apisix

    spec:

      containers:

        - name: apisix

          image: apache/apisix:3.18.0-debian

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 9080

          env:

            - name: OIDC_CLIENT_SECRET

              valueFrom:

                secretKeyRef:

                  name: apisix-oidc

                  key: client-secret

          volumeMounts:

            - name: config

              mountPath: /usr/local/apisix/conf/config.yaml

              subPath: config.yaml

              readOnly: true


            - name: routes

              mountPath: /usr/local/apisix/conf/apisix.yaml

              subPath: apisix.yaml

              readOnly: true


      volumes:

        - name: config

          configMap:

            name: apisix-config


        - name: routes

          configMap:

            name: apisix-routes


---

apiVersion: v1
kind: Service

metadata:
  name: apisix-gateway

spec:

  selector:
    app: apisix

  ports:

    - name: http

      port: 9080

      targetPort: 9080

  type: NodePort
