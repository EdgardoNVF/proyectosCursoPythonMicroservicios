apiVersion: apps/v1
kind: Deployment
metadata:
  name: microserviceuser
spec:
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: app
        image: microuser:1.0.0
        resources:
          limits:
            memory: "128Mi"
            cpu: "1"
          requests:
            memory: "50Mi"
            cpu: "100m"
        ports:
        - containerPort: 8000
