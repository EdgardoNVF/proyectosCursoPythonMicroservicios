apiVersion: v1
kind: Service

metadata:

  name: {{ include "microserviceuser.fullname" . }}

  labels:
    app.kubernetes.io/name: {{ include "microserviceuser.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:

  selector:

    app.kubernetes.io/name: {{ include "microserviceuser.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:

    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP

  type: {{ .Values.service.type }}