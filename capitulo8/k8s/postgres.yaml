apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc

spec:

  accessModes:
    - ReadWriteOnce

  storageClassName: standard

  resources:

    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:

  replicas: 1

  strategy:
    type: Recreate

  selector:

    matchLabels:
      app: postgres

  template:

    metadata:

      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: postgres:16-alpine

          ports:

            - containerPort: 5432

          envFrom:

            - secretRef:
                name: postgres-secret

          env:

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:

            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:

            exec:

              command:
                - pg_isready
                - -U
                - usersadmin
                - -d
                - usersdb

            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:

        - name: postgres-data

          persistentVolumeClaim:
            claimName: postgres-pvc

        - name: init-sql

          configMap:
            name: postgres-init

---

apiVersion: v1
kind: Service

metadata:
  name: postgres

spec:

  selector:
    app: postgres

  ports:

    - port: 5432
      targetPort: 5432

  type: ClusterIP
